<text x="1270.86" y="183.00" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle">Decision</text>
<text x="1270.86" y="218.00" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">confidence gates</text>
<text x="1270.86" y="242.00" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">champion</text>
