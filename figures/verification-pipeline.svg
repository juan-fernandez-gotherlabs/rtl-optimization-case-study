<text x="1080.57" y="218.00" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">64 disjoint paired seeds</text>
<circle cx="1019.43" cy="152.00" r="12.00" fill="#102A43" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="1019.43" y="157.00" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
