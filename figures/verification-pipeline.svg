<text x="45.00" y="350.00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#C83E4D" text-anchor="start">Any failed or inconclusive correctness gate invalidates the candidate before routed PPA is spent.</text>
