<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img">
<title>Verification-first optimization pipeline</title>
<desc>Seven stage flow from hash-frozen RTL through correctness and formal equivalence to search, certification, and evidence-based champion selection.</desc>
<rect x="0.00" y="0.00" width="1400.00" height="410.00" rx="0.00" fill="#FFFFFF" stroke="none" opacity="1.0"/>
<text x="45.00" y="46.00" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102A43" text-anchor="start">Correctness precedes PPA</text>
<text x="45.00" y="78.00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">The candidate generator is replaceable; the evaluator contract is fixed</text>
<rect x="45.00" y="130.00" width="168.29" height="150.00" rx="10.00" fill="#F6F8FB" stroke="#E8EEF4" opacity="1.0"/>
<text x="129.14" y="183.00" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle">Candidate</text>
<text x="129.14" y="218.00" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">sha.v frozen by SHA-256</text>
