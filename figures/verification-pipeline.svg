<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img">
<title>Verification-first optimization pipeline</title>
<desc>Six-stage flow from hash-frozen RTL through correctness and formal equivalence to paired PPA and an evidence-based acceptance decision.</desc>
<rect x="0.00" y="0.00" width="1400.00" height="410.00" rx="0.00" fill="#FFFFFF" stroke="none" opacity="1.0"/>
<text x="45.00" y="46.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0A0A0A" text-anchor="start">Correctness precedes PPA</text>
<text x="45.00" y="78.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6A6A6A" text-anchor="start">The accepted RTL is checked under one fixed functional and physical contract</text>
<rect x="45.00" y="130.00" width="200.00" height="150.00" rx="10.00" fill="#F8FBFF" stroke="#E5E5E5" opacity="1.0"/>
<text x="145.00" y="183.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Accepted RTL</text>
<text x="145.00" y="218.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">sha.v frozen by SHA-256</text>
<circle cx="68.00" cy="152.00" r="12.00" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="68.00" y="157.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="249.00" y1="205.00" x2="263.00" y2="205.00" stroke="#0A0A0A" stroke-width="2"/>
<path d="M 255.0 199.0 L 263.0 205.0 L 255.0 211.0" fill="none" stroke="#0A0A0A" stroke-width="2"/>
<rect x="267.00" y="130.00" width="200.00" height="150.00" rx="10.00" fill="#F8FBFF" stroke="#E5E5E5" opacity="1.0"/>
<text x="367.00" y="183.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Structural</text>
<text x="367.00" y="218.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">interface</text>
<text x="367.00" y="242.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">lint</text>
<text x="367.00" y="266.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">synthesis</text>
<circle cx="290.00" cy="152.00" r="12.00" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="290.00" y="157.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="471.00" y1="205.00" x2="485.00" y2="205.00" stroke="#0A0A0A" stroke-width="2"/>
<path d="M 477.0 199.0 L 485.0 205.0 L 477.0 211.0" fill="none" stroke="#0A0A0A" stroke-width="2"/>
<rect x="489.00" y="130.00" width="200.00" height="150.00" rx="10.00" fill="#F8FBFF" stroke="#E5E5E5" opacity="1.0"/>
<text x="589.00" y="183.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Functional</text>
<text x="589.00" y="218.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">cycle trace</text>
<text x="589.00" y="242.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">NIST</text>
<circle cx="512.00" cy="152.00" r="12.00" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="512.00" y="157.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="693.00" y1="205.00" x2="707.00" y2="205.00" stroke="#0A0A0A" stroke-width="2"/>
<path d="M 699.0 199.0 L 707.0 205.0 L 699.0 211.0" fill="none" stroke="#0A0A0A" stroke-width="2"/>
<rect x="711.00" y="130.00" width="200.00" height="150.00" rx="10.00" fill="#F8FBFF" stroke="#E5E5E5" opacity="1.0"/>
<text x="811.00" y="183.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Formal</text>
<text x="811.00" y="218.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">unbounded EQY</text>
<text x="811.00" y="242.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">fail closed</text>
<circle cx="734.00" cy="152.00" r="12.00" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="734.00" y="157.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<line x1="915.00" y1="205.00" x2="929.00" y2="205.00" stroke="#0A0A0A" stroke-width="2"/>
<path d="M 921.0 199.0 L 929.0 205.0 L 921.0 211.0" fill="none" stroke="#0A0A0A" stroke-width="2"/>
<rect x="933.00" y="130.00" width="200.00" height="150.00" rx="10.00" fill="#EAF2FF" stroke="#E5E5E5" opacity="1.0"/>
<text x="1033.00" y="183.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">PPA</text>
<text x="1033.00" y="218.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">64 fixed paired seeds</text>
<circle cx="956.00" cy="152.00" r="12.00" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="956.00" y="157.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<line x1="1137.00" y1="205.00" x2="1151.00" y2="205.00" stroke="#0A0A0A" stroke-width="2"/>
<path d="M 1143.0 199.0 L 1151.0 205.0 L 1143.0 211.0" fill="none" stroke="#0A0A0A" stroke-width="2"/>
<rect x="1155.00" y="130.00" width="200.00" height="150.00" rx="10.00" fill="#EAF2FF" stroke="#E5E5E5" opacity="1.0"/>
<text x="1255.00" y="183.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Decision</text>
<text x="1255.00" y="218.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6A6A6A" text-anchor="middle">metric and confidence gates</text>
<circle cx="1178.00" cy="152.00" r="12.00" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5" opacity="1.0"/>
<text x="1178.00" y="157.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="45.00" y="350.00" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0A0A0A" text-anchor="start">Any failed or inconclusive correctness gate invalidates the RTL before routed PPA is evaluated.</text>
</svg>
