name: Verify published comparison

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify hashes, RTL diff and 64-seed statistics
        run: python3 verify.py
      - name: Verify repository hygiene
        run: |
          python3 -m json.tool results/certification.json >/dev/null
          git diff --check
          git diff --exit-code
