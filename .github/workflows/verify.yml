name: Verify published RTL portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify both compact evidence packages
        run: python3 verify.py
      - name: Run SHA-1 adversarial verifier tests
        run: python3 -m unittest discover -s cases/sha1/tests -v
      - name: Run INT8 adversarial verifier tests
        run: python3 -m unittest discover -s cases/int8-matvec/tests -v
      - name: Confirm generated report data is current
        run: |
          python3 cases/sha1/scripts/generate_latex_data.py
          python3 cases/int8-matvec/tools/generate_report_data.py
          git diff --exit-code -- cases/sha1/report/latex/generated cases/int8-matvec/report/latex/generated
      - name: Verify repository hygiene
        run: |
          python3 -m json.tool cases/sha1/results/certification.json >/dev/null
          python3 -m json.tool cases/int8-matvec/certificate.json >/dev/null
          python3 -m json.tool cases/int8-matvec/full-evidence.json >/dev/null
          git diff --check
          git diff --exit-code
